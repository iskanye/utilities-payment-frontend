name: 'Deploy frontend to server'

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync dist to server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.FRONTEND_PATH }}/"

      - name: Update TLS certificate
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; \
             sudo mkdir -p /etc/ssl/utilities-payment; \
             yc certificate-manager certificate content \
               --id fpq8v14rgn8427slqnih \
               --chain /tmp/fullchain.pem \
               --key /tmp/privkey.pem; \
             sudo install -m 644 /tmp/fullchain.pem /etc/ssl/utilities-payment/fullchain.pem; \
             sudo install -m 600 /tmp/privkey.pem /etc/ssl/utilities-payment/privkey.pem; \
             rm -f /tmp/fullchain.pem /tmp/privkey.pem; \
             sudo systemctl reload nginx"

      - name: Upload nginx config
        run: |
          scp -P "${{ secrets.SSH_PORT || 22 }}" \
            ./nginx.conf \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/utilities-payment.nginx.conf"

      - name: Install nginx config and reload
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; \
             sudo install -d -m 755 /etc/nginx/conf.d; \
             sudo install -m 644 /tmp/utilities-payment.nginx.conf /etc/nginx/conf.d/utilities-payment.conf; \
             sudo rm -f /etc/nginx/conf.d/default.conf /etc/nginx/sites-enabled/default; \
             sudo nginx -t; \
             sudo systemctl reload nginx; \
             rm -f /tmp/utilities-payment.nginx.conf"
